<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCP DB Tools Config Admin</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/components.css" />
  </head>
  <body>
    <!-- 应用骨架：品牌顶栏 + 左侧导航 + 内容区（CSS grid，见 layout.css） -->
    <div class="app">
      <!-- 品牌顶栏：应用标识 + 全局操作，SPA 生命周期常驻；id 保留供 shell.js 引用 -->
      <header class="brandbar">
        <div class="brandbar__brand">
          <span class="brandbar__logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/>
            </svg>
          </span>
          <span class="brandbar__name">MCP DB Tools</span>
          <span id="appVersion" class="app-version" title="版本">v?</span>
        </div>
        <div class="brandbar__counters" id="brandCounters"
             title="审计对账：累计查询次数 / 今日查询次数 / 今日落盘条数（当日两数一致表示审计无丢失）">
          <span class="bc-cell">累计查询 <strong id="bcTotal">–</strong> 次</span>
          <span class="bc-cell bc-cell--daily">今日 <strong id="bcToday">–</strong> 次</span>
          <span class="bc-cell bc-cell--daily">已落盘 <strong id="bcPersisted">–</strong> 条</span>
        </div>
        <div class="toolbar" aria-label="全局操作">
          <button id="reloadBtn" type="button" class="button secondary">
            重新加载
          </button>
          <button id="saveBtn" type="button" class="button primary">
            保存配置
          </button>
        </div>
      </header>

      <!-- 侧边导航：nav.js 渲染纵向菜单项（图标 + 文字） -->
      <aside class="sidenav">
        <div class="nav-group-label">功能导航</div>
        <nav id="nav" class="nav" aria-label="功能导航"></nav>
      </aside>

      <!-- 内容区：页头（标题随视图切换）+ 视图容器（shell 注入各视图） -->
      <main class="content">
        <header class="page-head">
          <h1 id="viewTitle">项目管理</h1>
          <span id="eyebrow" class="eyebrow">Local Admin</span>
        </header>
        <div id="view" class="view-root"></div>
      </main>
    </div>

    <!-- 共享浮层：toast 与确认弹窗，由 shell 统一管理（原样保留） -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <dialog id="confirmDialog" class="dialog">
      <form method="dialog">
        <h2 id="confirmTitle">确认操作</h2>
        <p id="confirmMessage"></p>
        <div class="dialog-actions">
          <button value="cancel" type="submit" class="button secondary">
            取消
          </button>
          <button
            id="confirmOkBtn"
            value="ok"
            type="submit"
            class="button danger"
          >
            确认
          </button>
        </div>
      </form>
    </dialog>

    <!-- 未保存提示：三选一弹窗（保存 / 不保存 / 取消）。
         与 confirmDialog 独立，避免破坏现有删除确认等调用。 -->
    <dialog id="unsavedDialog" class="dialog">
      <form method="dialog">
        <h2 id="unsavedTitle">有未保存的修改</h2>
        <p id="unsavedMessage">当前配置已修改但尚未保存，是否保存？</p>
        <div class="dialog-actions">
          <button value="cancel" type="submit" class="button secondary">
            取消（留在页面）
          </button>
          <button value="discard" type="submit" class="button ghost">
            不保存
          </button>
          <button id="unsavedSaveBtn" value="save" type="submit" class="button primary">
            保存
          </button>
        </div>
      </form>
    </dialog>

    <script src="./scripts/admin-api.js"></script>
    <script src="./scripts/ui.js"></script>
    <script src="./scripts/nav.js"></script>
    <script src="./scripts/keywords.js"></script>
    <script src="./scripts/projects.js"></script>
    <script src="./scripts/transfer.js"></script>
    <script src="./scripts/logs.js"></script>
    <script src="./scripts/backups.js"></script>
    <script src="./scripts/settings.js"></script>
    <script src="./scripts/system.js"></script>
    <script src="./scripts/about.js"></script>
    <script src="./scripts/shell.js"></script>
  </body>
</html>
