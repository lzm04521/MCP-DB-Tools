name: release

# 打 v* tag 自动：dotnet publish + vpk pack（Velopack 安装包）+ 上传到对应 GitHub Release。
# 后续发版只需 git tag vX.Y.Z && git push origin vX.Y.Z，无需本地打包上传。
# 应用内「系统设置 → 应用更新」从 Release 的 releases.win.json 检查更新。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 Release 与上传 assets 需要写权限

jobs:
  release:
    name: build & release (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout（fetch-depth=0，git describe 需要 tag 历史注入版本号）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Publish + vpk pack（release.ps1：dotnet publish self-contained + vpk pack --icon app.ico）
        shell: pwsh
        run: ./release.ps1

      - name: Create Release + upload assets（含 releases.win.json 供应用内更新检查）
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true   # 读取 .github/release.yml 的分类规则
          files: |
            Releases/McpDbTools-win-Setup.exe
            Releases/McpDbTools-*-full.nupkg
            Releases/McpDbTools-win-Portable.zip
            Releases/releases.win.json
            Releases/assets.win.json
            Releases/RELEASES
